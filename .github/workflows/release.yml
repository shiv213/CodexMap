name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('Use a stable vMAJOR.MINOR.PATCH tag.')
          if tag[1:] != Path('VERSION').read_text().strip():
              raise SystemExit('Tag and VERSION do not match.')
          PY
      - run: python verify.py
      - run: node --check app/app.js
      - run: ./macos/build.sh
      - run: python scripts/release-package.py
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "CodexMap $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/CodexMap-source.zip dist/CodexMap-macOS.zip dist/SHA256SUMS.txt --clobber
